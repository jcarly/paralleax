stages:
  - verify

default:
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm install -g npm@12.0.1
    - npm ci --cache .npm --prefer-offline

quality:
  stage: verify
  script:
    - npm run lint
    - npm run format
    - npm run typecheck
    - npm run coverage
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/api/coverage/
      - apps/web/coverage/
      - packages/shared/coverage/

postgres-integration:
  stage: verify
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: paralleax
    POSTGRES_PASSWORD: paralleax
    POSTGRES_DB: paralleax_test
    POSTGRES_TEST_DATABASE_URL: postgres://paralleax:paralleax@postgres:5432/paralleax_test
  script:
    - npm run test:postgres -w @paralleax/api

e2e:
  stage: verify
  script:
    - npm run playwright:install -w @paralleax/web -- --with-deps
    - npm run test:e2e -w @paralleax/web
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
