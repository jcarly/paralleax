stages:
  - verify

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

quality:
  stage: verify
  script:
    - npm run lint
    - npm run format
    - npm run typecheck
    - npm run coverage
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/api/coverage/
      - apps/web/coverage/
      - packages/shared/coverage/

e2e:
  stage: verify
  script:
    - npm run playwright:install -w @paralleax/web -- --with-deps
    - npm run test:e2e -w @paralleax/web
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
