name: paralleax-production

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  POSTGRES_SSL: ${POSTGRES_SSL:-true}
  POSTGRES_SSL_CA: ${POSTGRES_SSL_CA:-}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  REGISTRATION_MODE: ${REGISTRATION_MODE:?REGISTRATION_MODE is required}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}

x-api-image: &api-image
  image: ${PARALLEAX_API_IMAGE:-paralleax-api:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: api

services:
  migrate:
    <<: *api-image
    command: ['node', 'apps/api/dist/main.js', '--migrate']
    environment: *api-environment
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    <<: *api-image
    environment: *api-environment
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${PARALLEAX_WEB_IMAGE:-paralleax-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_FORMBRICKS_WORKSPACE_ID: ${VITE_FORMBRICKS_WORKSPACE_ID:-}
        VITE_FORMBRICKS_APP_URL: ${VITE_FORMBRICKS_APP_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_URL: ${SENTRY_URL:-}
    environment:
      VITE_FORMBRICKS_WORKSPACE_ID: ${VITE_FORMBRICKS_WORKSPACE_ID:-}
      VITE_FORMBRICKS_APP_URL: ${VITE_FORMBRICKS_APP_URL:-}
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
