name: paralleax

x-proxy-environment: &proxy-environment
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,api,web}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,api,web}

x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  api:
    build: *dev-build
    image: paralleax-dev
    command: sh -c 'npm ci --audit=false --no-update-notifier 2>&1 ; npm run dev -w @paralleax/api'
    environment:
      <<: *proxy-environment
      CHOKIDAR_USEPOLLING: 'true'
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=2048'
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
    working_dir: /workspace

  web:
    build: *dev-build
    image: paralleax-dev
    command: sh -c 'npm ci --audit=false --no-update-notifier 2>&1 ; npm run dev -w @paralleax/web -- --host 0.0.0.0'
    environment:
      <<: *proxy-environment
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_PROXY_TARGET: http://api:3000
      NODE_OPTIONS: '--max-old-space-size=2048'
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      - api
